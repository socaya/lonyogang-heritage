name: lonyogang_heritage
description: LonyoGang Heritage — personal wealth, assets and legacy tracker.
publish_to: none
version: 0.4.8+11

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  cryptography: ^2.7.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  # Legacy / round launcher icons — the granary on the brand navy.
  image_path: "assets/launcher/legacy.png"
  min_sdk_android: 21
  # Adaptive icon (Android 8+): foreground on a solid navy background.
  adaptive_icon_background: "#102D3F"
  adaptive_icon_foreground: "assets/launcher/foreground.png"
  # Keep the monochrome icon (Android 13+ themed icons) consistent with
  # the foreground silhouette.
  adaptive_icon_monochrome: "assets/launcher/foreground.png"
  remove_alpha_ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/brand/theme1-granary.png
    - assets/brand/theme1-primary.png
