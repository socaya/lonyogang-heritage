name: lonyogang_heritage
description: Private wealth, assets and legacy tracking for Android and iOS.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  sqflite_sqlcipher: ^3.4.1
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.6
  uuid: ^4.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  file_picker: ^13.3.2
  open_filex: ^5.0.0
  share_plus: ^13.3.1
  fl_chart: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/theme1-granary.png
    - assets/brand/theme1-primary.png
