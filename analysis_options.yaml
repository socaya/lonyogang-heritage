include: package:flutter_lints/flutter.yaml
analyzer:
  errors:
    invalid_assignment: error
    missing_return: error
    dead_code: warning
    # Keep style-only lints out of the CI gate. The analyzer still prints
    # them locally so engineers can clean them up opportunistically; they
    # just no longer fail the build.
    prefer_const_constructors: ignore
    prefer_const_constructors_in_immutables: ignore
    prefer_const_literals_to_create_immutables: ignore
    prefer_const_declarations: ignore
    use_build_context_synchronously: ignore
    prefer_initializing_formals: ignore
    unnecessary_brace_in_string_interps: ignore
    unnecessary_import: ignore
linter:
  rules:
    avoid_print: true
