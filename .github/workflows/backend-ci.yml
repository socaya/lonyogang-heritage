name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --no-strict-peer-dependencies
      - name: Type check
        run: pnpm build
      - name: Vitest
        env:
          # testcontainers reuses the host Docker daemon provided by the
          # ubuntu runner. No extra services declared here.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: pnpm test
