name: Import approved mobile source from handoff
on:
  push:
    paths:
      - '.handoff/READY'
permissions:
  contents: write
jobs:
  unpack:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore app source and images
        run: |
          if [ ! -f .handoff/READY ]; then
            echo "Handoff already processed"
            exit 0
          fi
          find .handoff -name 'part-*.txt' -print | sort | xargs cat > /tmp/lonyogang-bundle.b64
          base64 --decode /tmp/lonyogang-bundle.b64 > /tmp/lonyogang-bundle.tar.xz
          tar -xJf /tmp/lonyogang-bundle.tar.xz -C .
          test -f src/screens/AppScreens.tsx
          test -f src/components/ui.tsx
          test -f assets/brand/theme1-primary.png
          test -f assets/brand/theme1-granary.png
          git add src/screens/AppScreens.tsx src/components/ui.tsx docs/REFERENCE_ASSET_MANIFEST.json assets/brand/
          git rm -r -f .handoff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: restore approved mobile screens and branding from source handoff'
          git push origin HEAD:main
