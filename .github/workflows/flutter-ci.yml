name: Flutter quality checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Android and iOS project wrappers
        run: |
          flutter create --platforms=android,ios --org com.lonyogang .
          rm -f test/widget_test.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-pub
      - name: Domain and widget tests
        run: flutter test --no-pub --exclude-tags=visual-export
      - name: Render 6.7-inch screen previews
        continue-on-error: true
        run: flutter test --no-pub test/export_screen_previews_test.dart
      - name: Upload 6.7-inch Flutter UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lonyogang-ui-previews-1080x2400
          path: build/ui-previews/*.png
          if-no-files-found: warn
      - name: Android debug APK
        run: flutter build apk --debug --no-pub
      - name: APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lonyogang-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
